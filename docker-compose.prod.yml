services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CSWEB_HOST: ${CSWEB_HOST}
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - php
    networks:
      - backend

  # MySQL publié uniquement sur l'IP privée (VPC) de la VM, pour le dashboard.
  # L'IP vient de MYSQL_BIND_IP dans .env (non versionné) ; par défaut 127.0.0.1,
  # donc jamais exposé sur l'IP publique si la variable est absente.
  mysql:
    ports:
      - "${MYSQL_BIND_IP:-127.0.0.1}:3306:3306"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - backend

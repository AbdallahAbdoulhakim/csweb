services:
  php:
    ports:
      - "80:80"

  mysql:
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      backend:
      csweb-data:
        aliases:
          - csweb-mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - backend
    depends_on:
      - mysql

networks:
  csweb-data:
    external: true